name: Unzip and Organize Files

on:
  push:
    branches: [main]

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip file
        run: |
          # قم بتنزيل الملف المضغوط أو استخدم الملف الموجود في المستودع
          unzip quran_reminder.zip -d extracted-files

      - name: Move files to root
        run: |
          mv extracted-files/* .
          rm -rf extracted-files

      - name: Commit changes
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Unzipped and moved files to root"
          git push
